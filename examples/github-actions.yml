# Example: check exported videos in pull requests.
# Copy to .github/workflows/video-qa.yml in your project and adjust the folder and profiles.
name: video-qa

on:
  pull_request:
    paths:
      - "exports/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true # if your videos are stored with Git LFS
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg and social-video-qa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pipx install git+https://github.com/deegitech/social-video-qa@v0.1.0
          svqa doctor

      - name: Check videos
        run: >
          svqa check exports/
          -p instagram-reels-api
          -p tiktok
          --junit svqa-report.xml
          --json svqa-report.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svqa-report
          path: svqa-report.*
